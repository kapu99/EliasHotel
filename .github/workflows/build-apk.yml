name: Build Elias Hotel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/elias/hotel
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          'rootProject.name = "EliasHotel"' \
          'include ":app"' > android/settings.gradle

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\'' version '\''8.7.3'\'' apply false' \
          '}' > android/build.gradle

          printf '%s\n' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.useAndroidX=true' > android/gradle.properties

          printf '%s\n' \
          'plugins {' \
          '    id '\''com.android.application'\''' \
          '}' \
          'android {' \
          '    namespace '\''com.elias.hotel'\''' \
          '    compileSdk 35' \
          '    defaultConfig {' \
          '        applicationId '\''com.elias.hotel'\''' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName '\''1.0'\''' \
          '    }' \
          '}' > android/app/build.gradle

          printf '%s\n' \
          '<resources>' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '    </style>' \
          '</resources>' > android/app/src/main/res/values/styles.xml

          printf '%s\n' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <application android:theme="@style/AppTheme" android:label="Elias Hotel">' \
          '        <activity android:name=".MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '    </application>' \
          '</manifest>' > android/app/src/main/AndroidManifest.xml

          printf '%s\n' \
          'package com.elias.hotel;' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.webkit.WebView;' \
          'public class MainActivity extends Activity {' \
          '    public void onCreate(Bundle b) {' \
          '        super.onCreate(b);' \
          '        WebView w = new WebView(this);' \
          '        w.getSettings().setJavaScriptEnabled(true);' \
          '        w.getSettings().setDomStorageEnabled(true);' \
          '        w.loadUrl("file:///android_asset/index.html");' \
          '        setContentView(w);' \
          '    }' \
          '}' > android/app/src/main/java/com/elias/hotel/MainActivity.java

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elias-Hotel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
